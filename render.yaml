services:
  - type: web
    name: linkedin-profile-api
    runtime: python
    plan: free
    region: singapore          # closest region; see README on IP reputation
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: CACHE_TTL_SECONDS
        value: "900"
      - key: CACHE_STALE_TTL_SECONDS
        value: "86400"
      - key: MIN_REQUEST_INTERVAL_SECONDS
        value: "2.5"
      - key: ENABLE_PUBLIC_FALLBACK
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
